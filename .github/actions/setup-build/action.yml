name: Set up build
description: Shared JDK and Gradle setup for GitHubApp workflows. Run after actions/checkout.

runs:
  using: composite
  steps:
    - name: Setup Java JDK
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
